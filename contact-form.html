<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Contact Us - Applite Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --grad-start: #4F46E5;
  --grad-end: #7C3AED;
  --grad: linear-gradient(135deg, var(--grad-start), var(--grad-end));
  --surface: #ffffff;
  --border: #E5E7EB;
  --text-primary: #111827;
  --text-secondary: #6B7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  background: var(--surface);
  border-radius: 20px;
  box-shadow: 0 30px 90px rgba(0,0,0,0.3);
  width: 100%;
  max-width: 500px;
  overflow: hidden;
}

.header {
  background: var(--grad);
  padding: 32px 32px 28px;
  text-align: center;
}

.header h1 {
  font-family: 'Sora', sans-serif;
  color: #fff;
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 8px;
}

.header p {
  color: rgba(255,255,255,0.9);
  font-size: 14px;
}

.body {
  padding: 32px;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 8px;
}

.required { color: #ef4444; }

.form-group input,
.form-group textarea,
.form-group select {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid var(--border);
  border-radius: 12px;
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  color: var(--text-primary);
  background: #F9FAFB;
  outline: none;
  transition: all 0.2s;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
  border-color: #818cf8;
  box-shadow: 0 0 0 4px rgba(99,102,241,0.1);
  background: #fff;
}

.form-group textarea {
  resize: vertical;
  min-height: 100px;
}

.submit-btn {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: var(--grad);
  color: #fff;
  font-family: 'Sora', sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  margin-top: 8px;
}

.submit-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 24px rgba(79,70,229,0.3);
}

.submit-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.success-message {
  display: none;
  text-align: center;
  padding: 40px 20px;
}

.success-message.show {
  display: block;
}

.checkmark {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: linear-gradient(135deg, #10b981, #059669);
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: successPop 0.5s cubic-bezier(0.34,1.56,0.64,1);
}

@keyframes successPop {
  from { transform: scale(0); }
  to { transform: scale(1); }
}

.success-message h2 {
  font-family: 'Sora', sans-serif;
  font-size: 24px;
  color: var(--text-primary);
  margin-bottom: 12px;
}

.success-message p {
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.6;
}

.error-message {
  background: #fef2f2;
  border: 1px solid #fecaca;
  color: #dc2626;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 13px;
  margin-bottom: 20px;
  display: none;
}

.error-message.show {
  display: block;
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Get in Touch</h1>
    <p>Fill out the form below and our team will contact you shortly</p>
  </div>

  <div class="body">
    <div id="error-message" class="error-message"></div>

    <form id="contact-form">
      <div class="form-group">
        <label>Name <span class="required">*</span></label>
        <input type="text" id="name" name="name" required placeholder="Your full name"/>
      </div>

      <div class="form-group">
        <label>Email <span class="required">*</span></label>
        <input type="email" id="email" name="email" required placeholder="your@email.com"/>
      </div>

      <div class="form-group">
        <label>Phone <span class="required">*</span></label>
        <input type="tel" id="phone" name="phone" required placeholder="+1 234 567 8900"/>
      </div>

      <div class="form-group">
        <label>Company</label>
        <input type="text" id="company" name="company" placeholder="Your company name (optional)"/>
      </div>

      <div class="form-group">
        <label>What can we help you with? <span class="required">*</span></label>
        <select id="intent" name="intent" required>
          <option value="">Select a topic</option>
          <option value="billing">Medical Billing</option>
          <option value="credentialing">Provider Credentialing</option>
          <option value="coding">Medical Coding</option>
          <option value="rcm">Revenue Cycle Management</option>
          <option value="demo">Request a Demo</option>
          <option value="pricing">Pricing Information</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Message</label>
        <textarea id="message" name="message" placeholder="Tell us more about your needs..."></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">Submit</button>
    </form>

    <div id="success-message" class="success-message">
      <div class="checkmark">
        <svg width="40" height="40" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <h2>Thank You!</h2>
      <p>We've received your information. Our team will contact you within 24 hours.</p>
    </div>
  </div>
</div>

<script>
const API_URL = "http://localhost:5000/submit-lead";

const form = document.getElementById('contact-form');
const submitBtn = document.getElementById('submit-btn');
const successDiv = document.getElementById('success-message');
const errorDiv = document.getElementById('error-message');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  
  errorDiv.classList.remove('show');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Submitting...';

  const formData = {
    name: document.getElementById('name').value.trim(),
    email: document.getElementById('email').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    company: document.getElementById('company').value.trim(),
    message: document.getElementById('message').value.trim(),
    intent: document.getElementById('intent').value
  };

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(formData)
    });

    const data = await res.json();

    if (data.success) {
      form.style.display = 'none';
      successDiv.classList.add('show');
    } else {
      errorDiv.textContent = data.error || 'Failed to submit form';
      errorDiv.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit';
    }
  } catch (err) {
    errorDiv.textContent = 'Could not connect to server. Please make sure api.py is running.';
    errorDiv.classList.add('show');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Submit';
  }
});
</script>
</body>
</html>
